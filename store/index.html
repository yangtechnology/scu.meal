<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>東吳學餐營運管制塔 (POS & KDS)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <script>
    window.MEALFLOW_FORCED_ROUTE = 'store';
  </script>
</head>
<body>
  <!-- 頂部導覽列 -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-title-group">
        <a href="../" style="text-decoration:none; color:inherit; display:flex; align-items:center; gap:6px;">
          <span style="font-size:1.35rem;">🍱</span>
          <span style="font-weight:900; font-size:1.08rem; letter-spacing:-0.3px;">東吳學餐營運管制塔</span>
        </a>
        <span class="role-badge" id="headerRoleBadge">🖥️ 店家櫃檯收銀與營運中心</span>
        <span class="sync-status" title="點擊立即同步雲端資料" style="cursor:pointer;" onclick="syncCloud(true)">
          <span class="sync-dot" id="syncDot"></span>
          <span id="syncText">連線中</span>
        </span>
      </div>

      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
        <div id="headerStoreControls" style="display:none; align-items:center; gap:8px; flex-wrap:wrap;">
          <button type="button" id="headerStoreOpenToggleBtn" class="store-status-toggle" onclick="toggleCurrentStoreOpenStatus()">🟢 營業中</button>
          <select id="storeTopSwitcher" class="select-input" style="width:auto; min-width:210px; padding:6px 12px; font-weight:800; font-size:0.84rem;" onchange="switchMerchantStore(this.value)"></select>
          <button type="button" class="filter-chip" style="padding:6px 12px; font-size:0.78rem;" onclick="openShiftZReportModal()" title="開啟今日錢箱交班日結單 (Z-Report)">🧾 交班日結</button>
          <button type="button" class="filter-chip" style="padding:6px 12px; font-size:0.78rem;" onclick="syncCloud(true)">🔄 同步雲端</button>
          <button type="button" class="btn-danger-soft" style="padding:6px 10px; font-size:0.78rem;" onclick="lockMerchantSession()" title="安全鎖定並卸載店家後台節點">🔒 鎖定後台</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section id="viewPortal" class="view-section">
      <div id="portalContentBox"></div>
    </section>
    <section id="viewOrder" class="view-section"></section>
    <section id="viewTicket" class="view-section">
      <div id="singleTicketContainer"></div>
    </section>
    <section id="viewStore" class="view-section active">
      <div class="store-shell-layout">
        <aside class="store-left-rail">
          <button type="button" class="store-rail-btn active" id="railBtn-pos" onclick="switchStoreTabMode('pos')" title="櫃檯點餐">
            <span class="rail-icon">🖥️</span><span>點餐</span>
          </button>
          <button type="button" class="store-rail-btn" id="railBtn-kds" onclick="switchStoreTabMode('kds')" title="訂單與備料管理">
            <span class="rail-icon">📋</span><span>訂單</span>
            <span id="railKdsBadge" class="tab-badge" style="display:none;">0</span>
          </button>
          <button type="button" class="store-rail-btn" id="railBtn-analytics" onclick="switchStoreTabMode('analytics')" title="財務與營運分析">
            <span class="rail-icon">📊</span><span>分析</span>
          </button>
          <button type="button" class="store-rail-btn" id="railBtn-settings" onclick="switchStoreTabMode('settings')" title="店務設定">
            <span class="rail-icon">⚙️</span><span>設定</span>
          </button>
        </aside>
        <div class="store-stage-area">
          <div id="storePanel-pos" style="display:block;"></div>
          <div id="storePanel-kds" style="display:none;"></div>
          <div id="storePanel-analytics" style="display:none;"></div>
          <div id="storePanel-settings" style="display:none;"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="../app.js"></script>
</body>
</html>
