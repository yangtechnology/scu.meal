<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>MealFlow</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/jpeg" href="./logo-icon.jpg">
  <link rel="apple-touch-icon" href="./logo-icon.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=26.2">
</head>
<body>

  <!-- 頂部導覽列 -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-title-group">
        <a href="./" class="brand-logo-link">
          <img src="./logo-icon.jpg" alt="MealFlow Icon" class="brand-logo-icon-img">
          <img src="./logo-text.png" alt="MealFlow" class="brand-logo-text-img">
        </a>
        <span class="role-badge" id="headerRoleBadge">⚡ 系統入口導覽</span>
        <span class="sync-status" title="點擊立即同步雲端資料" style="cursor:pointer;" onclick="syncCloud(true)">
          <span class="sync-dot" id="syncDot"></span>
          <span id="syncText">已同步</span>
        </span>
      </div>

      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
        <!-- 店家後台頂部控制列（僅在通過雲端 HMAC Session 驗證解鎖後顯示） -->
        <div id="headerStoreControls" style="display:none; align-items:center; gap:8px; flex-wrap:wrap;">
          <button type="button" id="headerStoreOpenToggleBtn" class="store-status-toggle" onclick="toggleCurrentStoreOpenStatus()">
            🟢 營業中
          </button>
          <select id="storeTopSwitcher" class="select-input" style="width:auto; min-width:210px; padding:6px 12px; font-weight:800; font-size:0.84rem;" onchange="switchMerchantStore(this.value)"></select>
          <button type="button" class="filter-chip" style="padding:6px 12px; font-size:0.78rem;" onclick="openShiftZReportModal()" title="開啟今日錢箱交班日結單">
            🧾 交班日結
          </button>
          <button type="button" class="filter-chip" style="padding:6px 12px; font-size:0.78rem;" onclick="syncCloud(true)">
            🔄 同步雲端
          </button>
          <button type="button" class="btn-danger-soft" style="padding:6px 10px; font-size:0.78rem;" onclick="lockMerchantSession()" title="立即銷毀時效憑證並鎖定後台">
            🔒 鎖定後台
          </button>
        </div>

        <!-- 學生端我的訂單與取餐推播綁定按鈕 -->
        <button type="button" id="headerMyOrdersBtn" class="btn-my-orders" style="display:none;" onclick="openMyOrdersDrawer()">
          <span>🧾 我的訂單 / 查單</span>
          <span id="headerMyOrdersCount" class="my-orders-count-badge" style="display:none;">0</span>
        </button>
        <button type="button" id="headerLineBindBtn" class="btn-line" style="padding:5px 11px; font-size:0.76rem;" onclick="openLineBindModal()">
          <span id="headerLineBtnText">💬 綁定取餐通知</span>
        </button>
        <select id="headerLangSelect" class="header-lang-select" onchange="setAppLanguage(this.value)" aria-label="Language" title="切換語言 / Switch Language">
          <option value="zh-TW">🌐 繁中</option>
          <option value="en">🌐 EN</option>
          <option value="ja">🌐 日本語</option>
          <option value="ko">🌐 한국어</option>
        </select>

        <!-- 學生端校區切換器 -->
        <div id="headerCampusSwitcher" class="campus-switcher" style="display:none;">
          <button type="button" id="btnCampus-雙溪校區" class="campus-btn active" onclick="switchCampus('雙溪校區')">雙溪校區</button>
          <button type="button" id="btnCampus-城中校區" class="campus-btn" onclick="switchCampus('城中校區')">城中校區</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 1. 系統入口導覽視圖 (Portal View) -->
    <section id="viewPortal" class="view-section active">
      <div id="portalContentBox"></div>
    </section>

    <!-- 2. 學生線上掃碼點餐視圖 (Order View) -->
    <section id="viewOrder" class="view-section">
      <div id="activeOrderFloatingBanner"></div>

      <div id="storeDirectoryBlock">
        <div id="aiSmartTipBox"></div>

        <div class="student-directory-toolbar">
          <div class="filter-row" style="margin-bottom:0; flex:1;">
            <button type="button" class="filter-chip active" id="filter-ALL" onclick="setFilter('ALL')">全部櫃位</button>
            <button type="button" class="filter-chip" id="filter-FAST" onclick="setFilter('FAST')">免排隊</button>
            <button type="button" class="filter-chip" id="filter-PROMO" onclick="setFilter('PROMO')">離峰優惠</button>
          </div>
          <div class="student-tool-pills">
            <button type="button" id="btnOpenOrderLookup" class="student-util-pill" onclick="openCrossDeviceLookupModal()">🔍 查單</button>
            <button type="button" id="btnOpenAiAdvisor" class="student-util-pill advisor" onclick="openAiConciergeModal()">✨ 選餐助手</button>
          </div>
        </div>

        <div id="storeListContainer" class="store-list"></div>
      </div>

      <div id="inStoreOrderingBlock" style="display:none;"></div>
    </section>

    <!-- 3. 訂單專屬防偽電子憑證視圖 (Ticket View) -->
    <section id="viewTicket" class="view-section">
      <div id="singleTicketContainer"></div>
    </section>

    <!-- 4. 店家全螢幕平板 POS 與 KDS 控單中心視圖 (Store View) -->
    <section id="viewStore" class="view-section">
      <div class="store-shell-layout">
        <aside class="store-left-rail">
          <button type="button" class="store-rail-btn active" id="railBtn-pos" onclick="switchStoreTabMode('pos')" title="櫃檯收銀點餐">
            <span class="rail-icon">🖥️</span><span>點餐</span>
          </button>
          <button type="button" class="store-rail-btn" id="railBtn-kds" onclick="switchStoreTabMode('kds')" title="廚房控單與備料管理">
            <span class="rail-icon">📋</span><span>訂單</span>
            <span id="railKdsBadge" class="tab-badge" style="display:none;">0</span>
          </button>
          <button type="button" class="store-rail-btn" id="railBtn-analytics" onclick="switchStoreTabMode('analytics')" title="財務與營運分析">
            <span class="rail-icon">📊</span><span>分析</span>
          </button>
          <button type="button" class="store-rail-btn" id="railBtn-settings" onclick="switchStoreTabMode('settings')" title="店務設定">
            <span class="rail-icon">⚙️</span><span>設定</span>
          </button>
        </aside>
        <div class="store-stage-area">
          <div id="storePanel-pos" style="display:block;"></div>
          <div id="storePanel-kds" style="display:none;"></div>
          <div id="storePanel-analytics" style="display:none;"></div>
          <div id="storePanel-settings" style="display:none;"></div>
        </div>
      </div>
    </section>
  </main>

  <button type="button" id="xpExitModeBtn" class="xp-exit-btn" onclick="exitXpMode()" title="退出 XP 滿版模式，返回後台查看日結與設定">退出滿版 / 回後台</button>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="./realtime-config.js?v=26.1"></script>
  <script src="./i18n.js?v=26.0"></script>
  <script src="./app.js?v=26.3"></script>
</body>
</html>
